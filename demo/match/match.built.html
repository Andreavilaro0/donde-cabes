<style>/* Dónde cabes: mapa que se va cerrando. Tokens from equipo/propuestas/inicio (#08121c, #ffcf4a, Avenir Next). */
.mt{--bg:#08121c;--ink:#eef4f2;--dim:#9fb0bc;--on:#ffcf4a;--line:#1f3346;--ease:cubic-bezier(.23,1,.32,1);
  position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);
  font:500 clamp(17px,1.25vw,26px)/1.35 "Avenir Next",system-ui,sans-serif}
.mt[hidden]{display:none}
html.mt-open,html.mt-open body{overflow:hidden}
.mt-map{position:absolute;inset:0}
.mt :focus{outline:none}
.mt :focus-visible{outline:3px solid var(--on);outline-offset:2px}

/* big counter on the map, readable from the back of the room */
.mt-count{position:absolute;right:3vw;top:3vh;z-index:2;text-align:right;pointer-events:none;
  font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;text-shadow:0 2px 18px #08121c}
.mt-count b{display:block;font-weight:800;font-size:clamp(64px,8.5vw,168px);line-height:.85;letter-spacing:-.02em;color:var(--on);font-variant-numeric:tabular-nums}
.mt-count span{display:block;font-size:clamp(18px,1.4vw,28px);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mt-count small{display:block;margin-top:.3em;font-size:clamp(16px,1.15vw,22px);color:var(--dim)}
.mt-count .mt-now{pointer-events:auto;margin-top:.6em;font-family:"Avenir Next",system-ui,sans-serif;text-shadow:none}
.mt-sw{display:inline-block;width:1em;height:.8em;margin-right:.4em;vertical-align:-.05em;border:1px solid #8796a3}
.mt-sw-unk{background:repeating-linear-gradient(135deg,#8796a3 0 2px,#0f1c28 2px 6px)}

/* side panel */
.mt-panel{position:absolute;z-index:3;left:0;top:0;bottom:0;width:clamp(420px,33vw,660px);overflow:auto;overscroll-behavior:contain;
  padding:clamp(20px,2.2vw,44px);background:rgba(8,18,28,.94);border-right:1px solid var(--line)}
.mt-grip{display:none}
.mt .mt-grip{border:0;background:none;padding:8px 40px 14px;margin:-6px auto 0;touch-action:none;cursor:grab}
.mt-grip span{display:block;width:44px;height:5px;border-radius:3px;background:#5a7286}
.mt-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:1em}
.mt h2{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;
  font-size:1.6em;line-height:.98;letter-spacing:-.02em;margin:0 0 .45em}
.mt-rule{color:var(--dim);margin:0 0 1.1em;font-size:.88em}
.mt button{font:inherit;color:inherit;cursor:pointer}
.mt-back,.mt-undo{background:none;border:1px solid var(--line);border-radius:999px;padding:.3em .9em;font-size:.8em}
.mt-undo:disabled{opacity:.35;cursor:default}

.mt-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.mt-step{counter-increment:s;border-top:1px solid var(--line)}
.mt-q{display:flex;flex-wrap:wrap;gap:.1em .6em;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:.55em 0}
.mt-q>span:first-child::before{content:counter(s,decimal-leading-zero);display:inline-block;width:2em;font-size:.7em;color:var(--dim);font-variant-numeric:tabular-nums}
.mt-a{margin-left:2.4em;flex-basis:100%;color:var(--on);font-weight:600}
.is-todo .mt-q{color:#5f7283}
.is-done .mt-q>span:first-child{color:var(--dim);font-size:.85em}
.is-active .mt-q{font-weight:700;font-size:1.1em}
.mt-body{padding:0 0 1em 2.4em;display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.mt-opt,.mt-go{border:2px solid var(--on);background:none;border-radius:999px;padding:.35em 1em;transition:transform .14s var(--ease),background-color .15s ease}
.mt .mt-opt[aria-pressed=true],.mt .mt-go{background:var(--on);color:#08121c;font-weight:700}
.mt-opt:active,.mt-go:active,.mt-pick:active{transform:scale(.97)}
.mt-check{display:flex;gap:.5em;align-items:center;flex-basis:100%;padding:.15em 0}
.mt-check input{width:1.1em;height:1.1em;accent-color:var(--on)}
.mt-num{display:flex;gap:.5em;align-items:center}
.mt-num input,.mt-num select{font:inherit;color:var(--ink);background:#0f1c28;border:1px solid #3a5266;border-radius:8px;padding:.2em .4em;width:6em;color-scheme:dark}
.mt-sel{flex-basis:100%}.mt-sel select{width:auto;max-width:100%}
.mt-note{flex-basis:100%;margin:.3em 0 0;color:var(--dim);font-size:.78em}
.mt-warn{margin:0 0 .9em 2.4em;padding:.6em .9em;color:#d6dee4;font-size:.78em}
.mt-warn a{color:var(--on)}

.mt-result{scroll-margin-top:40px;margin-top:1em;border-top:2px solid var(--on);padding-top:.8em}
.mt-result:focus{outline:none}
.mt-result h3{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;font-size:1.35em;line-height:1;margin:0 0 .3em}
.mt-top{list-style:none;padding:0;margin:.6em 0 0}
.mt-top>li{margin:0 0 1em}
.mt-pick{display:flex;gap:.5em;align-items:center;background:none;border:0;padding:0;font-weight:800;font-size:1.3em;color:var(--on);text-align:left}
.mt-pick i,.mt-label i{font-style:normal;display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--on);color:#08121c;font-size:.8em}
.mt-top ul{list-style:none;margin:.35em 0 0 .65em;padding:0 0 0 1.2em;border-left:2px solid #3a5266;font-size:.82em;color:#d6dee4}
.mt-top ul li:first-child{font-size:1.2em;font-weight:600;color:var(--ink)}
.mt-top ul li{margin:.15em 0}
.mt-unknown{margin-top:1em;font-size:.8em;color:var(--dim)}
.mt-unknown summary{cursor:pointer;padding:.3em 0}
.mt-unknown ul{margin:.3em 0;padding-left:1.2em;max-height:12em;overflow:auto}
.mt-credits{margin-top:1.5em;font-size:12px;line-height:1.5;color:#7c8e9b}
.mt-credits a{color:inherit}

/* map labels: HTML, no remote glyphs */
.mt-label{font-weight:700;font-size:clamp(15px,1.05vw,22px);color:var(--ink);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 4px #08121c,0 0 10px #08121c}
.mt-work{color:#08121c;background:#eef4f2;border-radius:6px;padding:.1em .5em;text-shadow:none}
.mt-label i{text-shadow:none}
.mt-label.is-top{color:#fff;font-size:clamp(18px,1.4vw,30px)}
.mt .maplibregl-ctrl-attrib{background:rgba(8,18,28,.8);color:#9fb0bc;font-size:12px}
.mt .maplibregl-ctrl-attrib a{color:#cfd9e0}


/* ---- iOS feel (encargo ios-componentes): radius 14, 44 px targets, press feedback, spring pill, switches ---- */
.mt{--r:14px;--press:cubic-bezier(.23,1,.32,1)}
.mt .mt-back,.mt .mt-undo,.mt .mt-go,.mt .mt-opt,.mt .mt-pick{min-height:44px;border-radius:var(--r);
  transition:transform .12s var(--press),background-color .15s ease,color .15s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mt .mt-back,.mt .mt-undo{border:0;background:rgba(238,244,242,.09);padding:0 1em;font-weight:600;font-size:.8em}
.mt .mt-go{border:0;background:var(--on);color:#08121c;font-weight:700;padding:0 1.2em;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 18px -8px rgba(255,207,74,.55)}
.mt .mt-back:active,.mt .mt-undo:not(:disabled):active,.mt .mt-go:active,.mt .mt-opt:active,.mt .mt-pick:active{transform:scale(.96);transition-duration:.06s}
@media (hover:hover) and (pointer:fine){.mt .mt-back:hover,.mt .mt-undo:not(:disabled):hover{background:rgba(238,244,242,.15)}.mt .mt-go:hover{background:#ffd966}}
/* segmented control */
.mt-seg{position:relative;display:inline-flex;gap:2px;padding:3px;border-radius:var(--r);background:rgba(238,244,242,.09);flex-wrap:nowrap}
.mt-pill{position:absolute;left:3px;top:3px;bottom:3px;width:0;opacity:0;border-radius:11px;background:var(--on);
  box-shadow:0 3px 10px -2px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.4) inset;will-change:transform}
.mt .mt-seg .mt-opt{position:relative;z-index:1;border:0;background:none;border-radius:11px;padding:0 1.05em;color:var(--ink);font-weight:600}
.mt .mt-seg .mt-opt.is-on,.mt .mt-seg .mt-opt[aria-pressed=true]{color:#08121c;background:none}
/* switches */
.mt-check{justify-content:space-between;min-height:44px;padding:.1em 0;border-bottom:1px solid rgba(238,244,242,.07);cursor:pointer}
.mt-check span{order:-1}
.mt-check input[role=switch]{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:51px;height:31px;margin:0;border-radius:999px;
  background:#2a3a48;cursor:pointer;transition:background-color .2s ease}
.mt-check input[role=switch]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.3),0 1px 1px rgba(0,0,0,.16);transform-origin:left center;transition:transform .3s cubic-bezier(.23,1,.32,1)}
.mt-check input[role=switch]:checked{background:var(--on)}
.mt-check input[role=switch]:checked::after{transform:translateX(20px)}
.mt-check input[role=switch]:active::after{transform:scaleX(1.15)}
.mt-check input[role=switch]:checked::after{transform-origin:right center}.mt-check input[role=switch]:checked:active::after{transform:translateX(20px) scaleX(1.15)}
/* fields */
.mt .mt-num input,.mt .mt-num select{min-height:44px;border-radius:var(--r);border:1px solid rgba(238,244,242,.14);background:rgba(238,244,242,.06);padding:0 .6em}
.mt .mt-num input:focus-visible,.mt .mt-num select:focus-visible{outline:3px solid var(--on);outline-offset:1px}
/* material only where the panel floats over the map */
.mt-panel{background:rgba(8,18,28,.8);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-right:1px solid rgba(238,244,242,.08)}
.mt-warn{border-radius:var(--r);background:rgba(238,244,242,.06)}
.mt-q{min-height:44px}
@media (prefers-reduced-transparency:reduce){.mt-panel{background:#08121c;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.mt-panel{background:#08121c}.mt .mt-back,.mt .mt-undo,.mt-seg{outline:1px solid #9fb0bc}}
@media (prefers-reduced-motion:reduce){.mt .mt-back,.mt .mt-undo,.mt .mt-go,.mt .mt-opt,.mt .mt-pick,.mt-check input[role=switch],.mt-check input[role=switch]::after{transition:none}}

/* phones: bottom sheet */
@media (max-width:760px){
  .mt{font-size:17px}
  .mt .mt-panel{top:auto;width:auto;right:0;max-height:56vh;border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:4px 18px 18px;will-change:transform}
  .mt .mt-grip{display:block;position:sticky;top:-4px;z-index:2;width:calc(100% + 36px);margin:-4px -18px 0;background:rgba(8,18,28,.98)}
  .mt-count{right:16px;top:12px}
  .mt-count b{font-size:56px}.mt-count span{font-size:14px}
  .mt h2{font-size:1.25em}
}
@media (prefers-reduced-motion:reduce){.mt-body{animation:none}.mt-opt,.mt-go{transition:none}}
#mt-title:focus,#mt-title:focus-visible{outline:none} /* focus target only, not a control */

/* apple-todo: list rows highlight on press, disclosure with its own chevron, quiet number fields, pill attribution */
.mt .mt-q{border-radius:10px;margin:0 -.4em;padding-left:.4em;padding-right:.4em;width:calc(100% + .8em);transition:background-color .2s ease}
.mt .mt-q:active{background:rgba(238,244,242,.08);transition-duration:0s}
.mt-unknown summary{list-style:none;display:flex;align-items:center;gap:.5em;min-height:44px;border-radius:10px}
.mt-unknown summary::-webkit-details-marker{display:none}
.mt-unknown summary::before{content:"";width:.5em;height:.5em;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .3s cubic-bezier(.23,1,.32,1)}
.mt-unknown[open] summary::before{transform:rotate(45deg)}
.mt-unknown summary:active{background:rgba(238,244,242,.08)}
.mt-num input[type=number]{-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.mt-num input[type=number]::-webkit-inner-spin-button,.mt-num input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.mt-warn a,.mt-credits a{text-decoration-thickness:1px;text-underline-offset:.18em}
.mt .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{margin:0 10px 10px 0;border-radius:10px;padding:2px 8px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@media (prefers-reduced-transparency:reduce){.mt .maplibregl-ctrl-attrib{background:#08121c;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.mt-unknown summary::before,.mt .mt-q{transition:none}}
</style>

  </aside>
</section>

<script>/* Dónde cabes: mapa que se va cerrando. Plain JS + MapLibre GL JS 5.24.1 (BSD-3-Clause).
   Idea of side panel, bottom sheet and short camera flights taken from Oasis-Madrid
   (github.com/ariaslombardero/Oasis-Madrid, Apache-2.0); no code copied.
   Nothing typed here leaves the page: no requests, no storage. */
(() => {
  const D = JSON.parse(document.getElementById('match-data').textContent);
  const M = D.municipalities, BY = Object.fromEntries(M.map(m => [m.ine, m]));
  const FID = {};
  D.outlines.features.forEach(f => { if (f.properties.ine) FID[f.properties.ine] = f.id; });
  const $ = id => document.getElementById(id), root = () => $('match');
  const eur = n => n.toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' €'; // data values as they come (rent can have one decimal)
  const eurDown = n => Math.floor(n + 1e-9).toLocaleString('es-ES') + ' €'; // cap and what is left: rounded down, as in the rest of the app
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const narrow = matchMedia('(max-width: 760px)');
  const hasLayer = k => D.layers.includes(k);

  // What each countable thing is called: [one, many]
  const THING = {
    health_centres: ['centro de salud o consultorio', 'centros de salud o consultorios', 'salud'],
    pharmacies: ['farmacia', 'farmacias', 'farmacia'],
    schools: ['colegio o instituto', 'colegios e institutos', 'colegios'],
    sports: ['instalación deportiva', 'instalaciones deportivas', 'deporte'],
    cultural: ['equipamiento cultural', 'equipamientos culturales', 'cultura'],
    parks: ['parque', 'parques', 'parques'],
    bus_stops: ['parada de bus interurbano', 'paradas de bus interurbano', 'bus interurbano'],
    metro_stations: ['estación de metro', 'estaciones de metro', 'metro'],
    rail_stations: ['estación de Cercanías', 'estaciones de Cercanías', 'Cercanías'],
    light_rail_stops: ['parada de metro ligero', 'paradas de metro ligero', 'metro ligero'],
    vets: ['centro veterinario', 'centros veterinarios', 'veterinario'],
    worship: ['lugar de culto', 'lugares de culto', 'lugares de culto'],
    dog_areas: ['zona canina (para perros)', 'zonas caninas (para perros)', 'zona canina'],
  };
  const TRANSPORT = ['metro_stations', 'rail_stations', 'light_rail_stops', 'bus_stops'];
  const SERVICES = ['health_centres', 'pharmacies', 'sports', 'cultural', 'parks', ...(hasLayer('worship') ? ['worship'] : [])];
  const DOG = ['parks', ...['dog_areas', 'vets'].filter(hasLayer)]; // pet: shown in «why»; the rule uses parks or dog areas

  // ---------- state ----------
  let S, history = [], opener = null, onClose = null;
  const fresh = o => ({
    annual: o.annual, share: o.share, earners: o.earners === 2 ? 2 : 1, capOverride: null,
    people: null, size: 3, kids: null, school: null, room: null, dog: null,
    transport: null, services: null, work: null, workHint: o.ine || '', step: 0, showFinal: false,
  });
  const cap = s => s.capOverride ?? s.annual * s.share * s.earners / 1200;

  // requirement list: [label, key, test(m) -> true | false | null]
  const count = (m, k) => m.around[k] === undefined ? undefined : m.around[k];
  function reqs(s) {
    const r = [['tu tope de alquiler', 'rent', m => m.rent ? m.rent.value * 1200 <= (s.capOverride != null
      ? s.capOverride * 1200 : s.annual * s.share * s.earners) : null]];
    const has = k => m => { const v = count(m, k); return v == null ? (v === undefined ? true : null) : v > 0; };
    if (s.kids) r.push(['peques de 0 a 4', 'kids', m => (m.nurseries > 0 || m.private_early > 0) ? true
      : (m.nurseries == null || m.private_early == null) ? null : false]);
    if (s.school) r.push(['edad escolar', 'schools', has('schools')]);
    // dog: a park or a dog area. dog_areas/vets are never 0 (OpenStreetMap: missing is not none), so this can only be yes or unknown
    if (s.dog) r.push(['mascota: parque o zona canina', 'dog', m => (m.around.parks > 0 || m.around.dog_areas > 0) ? true : null]);
    (s.transport || []).forEach(k => r.push([THING[k][2], k, has(k)]));
    (s.services || []).forEach(k => r.push([THING[k][2], k, has(k)]));
    return r;
  }
  function evaluate(s) {
    const R = reqs(s), out = { in: [], unknown: [], out: [] };
    for (const m of M) {
      let fail = null; const miss = [];
      for (const [label, , t] of R) { const v = t(m); if (v === false) { fail = label; break; } if (v === null) miss.push(label); }

    if (!ready) return;
    const fin = S.showFinal && r.in.length;
    const list = fin ? [...r.in.slice(0, 3), ...(S.work ? [BY[S.work]] : [])] : r.in;
    camTo(list.length ? bboxOf(list) : REGION, fin ? 10.6 : 11, fin ? 28 : 0);
  }
  function flyTo(ine) { const m = BY[ine]; if (m && m.bbox) camTo(bboxOf([m]), 13, 28); }
  // Camera: one spring on a plain object {lng, lat, zoom, pitch}, applied with jumpTo each frame.
  // A new answer retargets the same object, so Motion keeps the velocity: no jump, no restart.
  let cam = null, camAnim = null, camBusy = false;
  function camTo(bounds, maxZoom, pitch) {
    const c = map.cameraForBounds(bounds, { padding: pad(), maxZoom });
    if (!c) return;
    const to = { lng: c.center.lng, lat: c.center.lat, zoom: c.zoom, pitch };
    if (reduced.matches || !window.Motion) { map.jumpTo({ center: [to.lng, to.lat], zoom: to.zoom, pitch: reduced.matches ? 0 : pitch }); return; }
    if (!camBusy || !cam) { const n = map.getCenter(); cam = { lng: n.lng, lat: n.lat, zoom: map.getZoom(), pitch: map.getPitch() }; }
    camBusy = true;
    const t = [], run = { last: performance.now(), on: true };
    const tick = now => { if (!run.on) return; t.push(now - run.last); run.last = now; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
    const mine = camAnim = Motion.animate(cam, to, { type: 'spring', visualDuration: 0.85, bounce: 0,
      onUpdate: () => map.jumpTo({ center: [cam.lng, cam.lat], zoom: cam.zoom, pitch: cam.pitch }) });
    mine.finished.then(() => {
      run.on = false; const f = t.slice(1);
      window.__mtFrames = { frames: f.length, avgMs: +(f.reduce((a, b) => a + b, 0) / (f.length || 1)).toFixed(1), worstMs: +Math.max(0, ...f).toFixed(1), over33: f.filter(x => x > 33.4).length };
      if (camAnim === mine) camBusy = false;
    }, () => { run.on = false; });
  }

  // ---------- events ----------
  root().addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (b.classList.contains('mt-grip')) return;
    if (b.id === 'mt-back') return close();
    if (b.id === 'mt-undo') { if (history.length) { S = JSON.parse(history.pop()); render(true); } return; }
    if (b.id === 'mt-now') return change(s => { s.showFinal = true; s.step = STEPS.length; });
    if (d.fly) return flyTo(d.fly);
    if (d.drop) return change(s => dropReq(s, d.drop));
    if (d.open != null) { const i = +d.open; if (i !== S.step || S.showFinal) { history.push(JSON.stringify(S)); S.step = i; S.showFinal = false; render(false); } return; }
    if (d.k && b.closest('.mt-seg') && !reduced.matches && !d.go) {
      if (d.wait) return;
      movePill(b.parentNode, b, true); d.wait = '1';
      return setTimeout(() => { d.go = '1'; b.click(); }, 150); // let the pill land, then the step folds
    }
    if (d.k) return change(s => {
      const v = d.v === 'true' ? true : d.v === 'false' ? false : d.v;
      if (d.k === 'people') { s.people = v; if (v === 'solo') { s.earners = 1; s.earnersSet = true; } }
      else if (d.k === 'earners') { s.earners = +v; s.earnersSet = true; s.capOverride = null; }
      else s[d.k] = v;
      if (d.k === 'people' && v === 'familia') s.people = null, s.pendingFamily = true; // wait for the size and «Listo»
    });
    if (d.done) return change(s => {
      const body = b.closest('.mt-body');
      if (d.done === 'people') { s.people = 'familia'; s.pendingFamily = false; s.size = Math.max(3, +body.querySelector('[data-num="size"]').value || 3); }
      else if (d.done === 'cap') { const v = +body.querySelector('[data-num="cap"]').value; if (v > 0) { if (Math.floor(v) !== Math.floor(cap(s) + 1e-9)) s.capOverride = v; s.capSet = true; } }
      else if (d.done === 'work') { s.work = body.querySelector('[data-num="work"]').value || null; s.workSet = true; }
      else s[d.done] = [...body.querySelectorAll(`[data-multi="${d.done}"]:checked`)].map(i => i.value);
    });
  });
  root().addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input[type=number]')) { e.preventDefault(); const go = e.target.closest('.mt-body').querySelector('.mt-go'); if (go) go.click(); }
  });
  narrow.addEventListener('change', () => { panel.style.transform = ''; sheetY = liveY = 0; if (map) frame(evaluate(S)); });

  // ---------- bottom sheet on phones: drag the grip, flick or tap; Enter/Space toggles ----------
  const panel = $('mt-panel'), grip = root().querySelector('.mt-grip');
  // Apple «Designing Fluid Interfaces»: start from the live value, track 1:1, rubber-band past the top,
  // project the flick (d = 0.998) to pick the snap point, hand the finger's velocity to the spring.
  let sheetY = 0, liveY = 0, drag = null, dragged = false, sheetAnim = null;
  const lowY = () => Math.max(0, panel.offsetHeight - 132);
  const putY = y => { liveY = y; panel.style.transform = `translateY(${y}px)`; };
  const rubber = (o, dim) => (o * dim * 0.55) / (dim + 0.55 * Math.abs(o));
  function setSheet(y, velocity = 0) {
    sheetY = y; grip.setAttribute('aria-expanded', String(y === 0));
    if (sheetAnim) sheetAnim.stop();
    if (window.Motion && !reduced.matches) sheetAnim = Motion.animate(liveY, y, { type: 'spring', velocity, bounce: 0, duration: 0.4, onUpdate: putY });
    else putY(y);
    if (map) setTimeout(() => frame(evaluate(S)), reduced.matches ? 0 : 220);
  }
  grip.addEventListener('pointerdown', e => {
    if (!narrow.matches || drag) return; // one pointer at a time
    if (sheetAnim) sheetAnim.stop(); // grab it mid-flight
    grip.setPointerCapture(e.pointerId); drag = { id: e.pointerId, y0: e.clientY, base: liveY, hist: [[performance.now(), e.clientY]] }; dragged = false;
  });
  grip.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y0; if (Math.abs(dy) > 6) dragged = true;
    let y = drag.base + dy, low = lowY();
    if (y < 0) y = -rubber(-y, innerHeight); else if (y > low) y = low + rubber(y - low, innerHeight);
    putY(y); drag.hist.push([performance.now(), e.clientY]); if (drag.hist.length > 5) drag.hist.shift();
  });
  grip.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const h = drag.hist, a = h[0], z = h[h.length - 1], v = z[0] > a[0] ? (z[1] - a[1]) / (z[0] - a[0]) * 1000 : 0; // px/s
    drag = null;
    if (!dragged) return;
    const projected = liveY + (v / 1000) * 0.998 / (1 - 0.998);
    setSheet(projected > lowY() / 2 ? lowY() : 0, v);
  });
  grip.addEventListener('click', () => { if (dragged) { dragged = false; return; } setSheet(sheetY === 0 ? lowY() : 0); });

  let viaKeys = false;
  addEventListener('keydown', () => { viaKeys = true; }, true);
  addEventListener('pointerdown', () => { viaKeys = false; }, true);
  function open(o) {
    opener = document.activeElement; onClose = o.onClose || null; history = [];
    S = fresh(o); S.step = nextStep(S);
    root().hidden = false; document.documentElement.classList.add('mt-open');
    if (!map) makeMap(); else { map.resize(); render(true); }
    renderSteps(); render(false);
    enter();
    // keyboard users land on the first answer; pointer users get no ring (focus goes to the title)
    const f = viaKeys ? root().querySelector('.mt-body button') : $('mt-title'); if (f) f.focus({ preventScroll: true });
  }
  // Entrance (encargo ios-cambio1): list from its side (the sheet from below), blocks staggered, counter from the right.
  // Critically damped springs, transform and opacity only, settled under 900 ms; clicks work from the first frame.
  function enter() {
    if (!window.Motion) return;
    const A = Motion.animate, sp = { type: 'spring', bounce: 0, duration: 0.4 };
    const items = [...panel.querySelectorAll(':scope > header, :scope > h2, :scope > .mt-rule, #mt-steps > li')];
    if (reduced.matches) { A([panel, $('mt-count')], { opacity: [0, 1] }, { duration: 0.2 }); return; }
    if (narrow.matches) { if (sheetAnim) sheetAnim.stop(); sheetAnim = A(panel.offsetHeight, 0, { ...sp, onUpdate: putY }); }
    else A(panel, { transform: ['translateX(-48px)', 'none'], opacity: [0, 1] }, sp);
    A(items, { transform: ['translateX(-28px)', 'none'], opacity: [0, 1] }, { ...sp, delay: Motion.stagger(0.03) });
    A($('mt-count'), { transform: ['translateX(40px)', 'none'], opacity: [0, 1] }, { ...sp, delay: 0.08 });
  }
  // Exit by the same side it came in: list to the left (sheet down), counter to the right; then hide.
  function close() {
    if (!window.Motion || reduced.matches) return hide();
    const A = Motion.animate, sp = { type: 'spring', bounce: 0, duration: 0.3 };
    A($('mt-count'), { transform: 'translateX(40px)', opacity: 0 }, sp);
    const out = narrow.matches ? A(liveY, panel.offsetHeight, { ...sp, onUpdate: putY }) : A(panel, { transform: 'translateX(-48px)', opacity: 0 }, sp);
    out.finished.then(hide, hide);
  }
  function hide() {
    if (root().hidden) return;
    panel.style.transform = panel.style.opacity = $('mt-count').style.transform = $('mt-count').style.opacity = ''; sheetY = liveY = 0;
    root().hidden = true; document.documentElement.classList.remove('mt-open');
    document.dispatchEvent(new CustomEvent('dondecabes:matchclose'));
    if (onClose) onClose();
    if (opener && opener.focus) opener.focus();
  }
  // Family: show size field without leaving the step
  const oldUi = STEPS[0].ui; STEPS[0].ui = s => oldUi(s.pendingFamily ? { ...s, people: 'familia' } : s);

  $('mt-credits').innerHTML = `<p>Mapa: MapLibre GL JS 5.24.1, licencia BSD-3-Clause. Calles al acercarte: IGN, CC BY 4.0 scne.es (necesitan conexión). Movimiento: Motion 14.14.0, licencia MIT. Idea de panel lateral y vuelos de cámara: Oasis-Madrid, Apache-2.0 (no se usa su código). Letra: Avenir Next del sistema.</p>`
    + `<p>Alquiler: ${D.definitions.rent} ${D.sources['alquiler-mivau'].note || ''}</p>` + [...new Map(Object.values(D.sources).filter(x => x.credit).map(x => [x.credit, x.link])).entries()].map(([c, l]) => `<p>${c}${l ? ` <a href="${l}" target="_blank" rel="noopener">${l}</a>` : ''}</p>`).join('');

  window.dondeCabes = Object.assign(window.dondeCabes || {}, { openMatch: open, closeMatch: close });
})();
</script>
